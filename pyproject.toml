[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-cross-species-benchmark"
version = "0.1.0"
description = "Multi-criterion cross-species embryonic representation benchmark"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["vec_xspecies*"]
